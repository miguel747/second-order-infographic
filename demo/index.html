<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1924" />
  <title>second-order-infographic — Demo</title>

  <!-- Google Fonts (compartilhado com o widget) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- MathJax 3 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath:  [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        packages:    { '[+]': ['ams'] },
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
      startup: { typeset: false },
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>

  <!-- CSS do widget -->
  <link rel="stylesheet" href="../styles/infographic.css" />

  <style>
    /* ── Reset e base da página de demo ────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:          #0A1924;
      --surface:          #133B4D;
      --surface-light:    #1A4D63;
      --text-primary:     #EAEFEF;
      --text-secondary:   #B8C4C4;
      --accent-primary:   #C99400;
      --accent-secondary: #6B703F;
      --accent-sec-light: #8A9050;
      --border-subtle:    rgba(234,239,239,0.08);
      --border-accent:    rgba(201,148,0,0.25);
      --border-green:     rgba(107,112,63,0.30);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100dvh;
      padding: 0;
    }

    /* ── Wrapper da página ─────────────────────────────────────────────── */
    .demo-page {
      max-width: 1140px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ── Cabeçalho da demo ─────────────────────────────────────────────── */
    .demo-header {
      margin-bottom: 2.2rem;
      padding-bottom: 1.8rem;
      border-bottom: 1px solid var(--border-subtle);
      animation: fadeUp 0.45s ease-out both;
    }

    .demo-header .tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-sec-light);
      background: rgba(107,112,63,0.15);
      border: 1px solid var(--border-green);
      padding: 0.3em 0.9em;
      border-radius: 3px;
      margin-bottom: 0.9rem;
    }

    .demo-header h1 {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .demo-header h1 span { color: var(--accent-primary); }

    .demo-header .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* ── Presets ───────────────────────────────────────────────────────── */
    .demo-preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.4rem;
      animation: fadeUp 0.5s 0.05s ease-out both;
    }

    .demo-preset-row button {
      padding: 0.35em 1em;
      border: 1px solid var(--border-subtle);
      border-radius: 3px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .demo-preset-row button:hover {
      background: var(--surface-light);
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .demo-preset-row button.active {
      background: rgba(201,148,0,0.15);
      color: var(--accent-primary);
      border-color: var(--border-accent);
      font-weight: 600;
    }

    /* ── Painel de controles ───────────────────────────────────────────── */
    .demo-controls {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.4rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
      align-items: flex-end;
      animation: fadeUp 0.5s 0.1s ease-out both;
    }

    .demo-controls label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .demo-controls select,
    .demo-controls input[type="number"] {
      padding: 0.45em 0.8em;
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      background: var(--surface-light);
      color: var(--text-primary);
      min-width: 100px;
      transition: border-color 0.2s;
      /* Evita zoom no iOS */
      font-size: max(16px, 0.9rem);
    }

    .demo-controls select:focus,
    .demo-controls input[type="number"]:focus {
      outline: none;
      border-color: var(--border-accent);
    }

    .demo-controls input[type="number"] { min-width: 80px; }

    .demo-controls .ctrl-group {
      display: flex;
      gap: 0.8rem 1.2rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    /* Botões de ação */
    .demo-btn-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .demo-controls button {
      padding: 0.5em 1.3em;
      border-radius: 5px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #0A1924;
      border-color: var(--accent-primary);
    }
    .btn-primary:hover {
      background: var(--accent-sec-light);
      border-color: var(--accent-sec-light);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-subtle);
    }
    .btn-secondary:hover {
      background: var(--surface-light);
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    /* Toggle tema */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .theme-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-primary);
    }

    /* ── Widget container ──────────────────────────────────────────────── */
    .demo-widget-wrap {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      margin-bottom: 1.8rem;
      animation: fadeUp 0.5s 0.15s ease-out both;
    }

    /* ── Painel de validação ───────────────────────────────────────────── */
    .demo-validation {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.4rem 1.5rem;
      animation: fadeUp 0.5s 0.2s ease-out both;
    }

    .demo-validation h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .demo-validation pre {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      background: var(--surface-light);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 1rem 1.1rem;
      overflow-x: auto;
      color: var(--text-secondary);
      line-height: 1.7;
      -webkit-overflow-scrolling: touch;
    }

    .demo-validation .pass { color: var(--accent-sec-light); font-weight: 700; }
    .demo-validation .fail { color: #c4717a; font-weight: 700; }

    /* ── Animação ──────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsividade da demo ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .demo-page { padding: 1.4rem 1rem 3rem; }
      .demo-controls { padding: 1rem; gap: 0.8rem 1rem; }
      .demo-validation { padding: 1rem; }
      .demo-validation pre { font-size: 0.72rem; padding: 0.8rem; }
    }

    @media (max-width: 400px) {
      .demo-page { padding: 1rem 0.75rem 2.5rem; }
    }
  </style>
</head>
<body>
<div class="demo-page">

  <!-- Cabeçalho -->
  <div class="demo-header">
    <div class="tag">Widget Educacional</div>
    <h1>second-order-<span>infographic</span></h1>
    <div class="subtitle">Infográfico dinâmico de sistemas de 2ª ordem — Vanilla JS · SVG · MathJax</div>
  </div>

  <!-- Presets rápidos -->
  <div class="demo-preset-row" id="presets">
    <button data-preset="acceptance" class="active">Critério de Aceite {a2:1, a1:6, a0:25}</button>
    <button data-preset="underdamped_light">Subamortecido leve (ζ=0.3)</button>
    <button data-preset="critically">Criticamente amortecido (ζ=1)</button>
    <button data-preset="overdamped">Superamortecido (ζ=2)</button>
    <button data-preset="marginal">Marginal (ζ=0)</button>
    <button data-preset="poles_input">Entrada por polos</button>
    <button data-preset="high_wn">Alta frequência (ωn=50)</button>
  </div>

  <!-- Controles manuais -->
  <div class="demo-controls">

    <label>
      Modo de entrada
      <select id="ctrl-mode">
        <option value="canonical" selected>canonical</option>
        <option value="coefficients">coefficients</option>
        <option value="poles">poles</option>
      </select>
    </label>

    <!-- canonical -->
    <div id="group-canonical" class="ctrl-group">
      <label>ζ (zeta)
        <input type="number" id="ctrl-zeta" value="0.6" step="0.05" min="0" max="5" style="width:82px"/>
      </label>
      <label>ωn (rad/s)
        <input type="number" id="ctrl-wn" value="5" step="0.5" min="0.1" style="width:82px"/>
      </label>
      <label>kdc
        <input type="number" id="ctrl-kdc" value="1" step="0.1" style="width:72px"/>
      </label>
    </div>

    <!-- coefficients (oculto) -->
    <div id="group-coefficients" class="ctrl-group" style="display:none">
      <label>a2 <input type="number" id="ctrl-a2" value="1"  step="0.1" style="width:72px"/></label>
      <label>a1 <input type="number" id="ctrl-a1" value="6"  step="0.1" style="width:72px"/></label>
      <label>a0 <input type="number" id="ctrl-a0" value="25" step="0.1" style="width:72px"/></label>
    </div>

    <!-- poles (oculto) -->
    <div id="group-poles" class="ctrl-group" style="display:none">
      <label>Polo 1 Re <input type="number" id="ctrl-p1re" value="-3" step="0.5" style="width:72px"/></label>
      <label>Polo 1 Im <input type="number" id="ctrl-p1im" value="4"  step="0.5" style="width:72px"/></label>
      <label>Polo 2 Re <input type="number" id="ctrl-p2re" value="-3" step="0.5" style="width:72px"/></label>
      <label>Polo 2 Im <input type="number" id="ctrl-p2im" value="-4" step="0.5" style="width:72px"/></label>
    </div>

    <label>Rise Time Mode
      <select id="ctrl-rise">
        <option value="10-90" selected>10-90 %</option>
        <option value="first-crossing">1ª passagem</option>
      </select>
    </label>

    <label>Settling Band
      <select id="ctrl-band">
        <option value="0.02" selected>2 %</option>
        <option value="0.05">5 %</option>
        <option value="0.01">1 %</option>
      </select>
    </label>

    <label class="theme-toggle">
      <input type="checkbox" id="ctrl-theme" />
      Tema claro
    </label>

    <div class="demo-btn-row">
      <button class="btn-primary"   id="btn-update">Atualizar</button>
      <button class="btn-secondary" id="btn-destroy">Destruir</button>
      <button class="btn-secondary" id="btn-remount">Re-montar</button>
    </div>

  </div>

  <!-- Widget -->
  <div class="demo-widget-wrap">
    <div id="widget-container"></div>
  </div>

  <!-- Validação -->
  <div class="demo-validation">
    <h2>Critérios de Aceite — Validação Automática</h2>
    <pre id="validation-output">Aguardando renderização inicial...</pre>
  </div>

</div><!-- /demo-page -->

<!-- ESM -->
<script type="module">
  import { mountSecondOrderInfographic } from '../src/mount.js';

  let instance = null;

  const PRESETS = {
    acceptance:       { mode:'coefficients', a2:1, a1:6, a0:25, kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    underdamped_light:{ mode:'canonical', zeta:0.3, wn:5,  kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    critically:       { mode:'canonical', zeta:1.0, wn:5,  kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    overdamped:       { mode:'canonical', zeta:2.0, wn:5,  kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    marginal:         { mode:'canonical', zeta:0.0, wn:5,  kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    poles_input:      { mode:'poles', poles:[{re:-3,im:4},{re:-3,im:-4}], kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
    high_wn:          { mode:'canonical', zeta:0.5, wn:50, kdc:1, riseTimeMode:'10-90', settlingBand:0.02 },
  };

  function mount(config) {
    const container = document.getElementById('widget-container');
    if (instance) { instance.destroy(); instance = null; }
    instance = mountSecondOrderInfographic(container, config);
    return instance;
  }

  function readControls() {
    const mode = document.getElementById('ctrl-mode').value;
    const rise = document.getElementById('ctrl-rise').value;
    const band = parseFloat(document.getElementById('ctrl-band').value);
    const light = document.getElementById('ctrl-theme').checked;
    const cfg  = { mode, riseTimeMode: rise, settlingBand: band, theme: light ? 'light' : 'dark' };

    if (mode === 'canonical') {
      cfg.zeta = parseFloat(document.getElementById('ctrl-zeta').value);
      cfg.wn   = parseFloat(document.getElementById('ctrl-wn').value);
      cfg.kdc  = parseFloat(document.getElementById('ctrl-kdc').value);
    } else if (mode === 'coefficients') {
      cfg.a2  = parseFloat(document.getElementById('ctrl-a2').value);
      cfg.a1  = parseFloat(document.getElementById('ctrl-a1').value);
      cfg.a0  = parseFloat(document.getElementById('ctrl-a0').value);
      cfg.kdc = parseFloat(document.getElementById('ctrl-kdc').value);
    } else if (mode === 'poles') {
      cfg.poles = [
        { re: parseFloat(document.getElementById('ctrl-p1re').value), im: parseFloat(document.getElementById('ctrl-p1im').value) },
        { re: parseFloat(document.getElementById('ctrl-p2re').value), im: parseFloat(document.getElementById('ctrl-p2im').value) },
      ];
      cfg.kdc = parseFloat(document.getElementById('ctrl-kdc').value);
    }
    return cfg;
  }

  function syncGroups(mode) {
    document.getElementById('group-canonical').style.display    = mode === 'canonical'    ? 'flex' : 'none';
    document.getElementById('group-coefficients').style.display = mode === 'coefficients' ? 'flex' : 'none';
    document.getElementById('group-poles').style.display        = mode === 'poles'        ? 'flex' : 'none';
  }

  document.getElementById('ctrl-mode').addEventListener('change', e => syncGroups(e.target.value));

  document.getElementById('btn-update').addEventListener('click', () => {
    const cfg = readControls();
    if (instance) instance.update(cfg).then(() => runValidation(cfg));
    else mount(cfg);
  });

  document.getElementById('btn-destroy').addEventListener('click', () => {
    if (instance) { instance.destroy(); instance = null; }
  });

  document.getElementById('btn-remount').addEventListener('click', () => {
    mount(readControls());
  });

  document.getElementById('presets').addEventListener('click', e => {
    const btn = e.target.closest('[data-preset]');
    if (!btn) return;
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const cfg = PRESETS[btn.dataset.preset];
    if (!cfg) return;

    document.getElementById('ctrl-mode').value = cfg.mode;
    syncGroups(cfg.mode);

    if (cfg.mode === 'canonical') {
      document.getElementById('ctrl-zeta').value = cfg.zeta;
      document.getElementById('ctrl-wn').value   = cfg.wn;
      document.getElementById('ctrl-kdc').value  = cfg.kdc ?? 1;
    } else if (cfg.mode === 'coefficients') {
      document.getElementById('ctrl-a2').value  = cfg.a2;
      document.getElementById('ctrl-a1').value  = cfg.a1;
      document.getElementById('ctrl-a0').value  = cfg.a0;
      document.getElementById('ctrl-kdc').value = cfg.kdc ?? 1;
    } else if (cfg.mode === 'poles') {
      document.getElementById('ctrl-p1re').value = cfg.poles[0].re;
      document.getElementById('ctrl-p1im').value = cfg.poles[0].im;
      document.getElementById('ctrl-p2re').value = cfg.poles[1].re;
      document.getElementById('ctrl-p2im').value = cfg.poles[1].im;
    }

    const light = document.getElementById('ctrl-theme').checked;
    const fullCfg = { ...cfg, theme: light ? 'light' : 'dark' };

    if (instance) instance.update(fullCfg).then(() => runValidation(fullCfg));
    else mount(fullCfg);
  });

  document.getElementById('ctrl-theme').addEventListener('change', e => {
    if (instance) instance.update({ ...readControls(), theme: e.target.checked ? 'light' : 'dark' });
  });

  // ── Validação dos critérios de aceite ────────────────────────────────────
  function runValidation(cfg) {
    import('../src/core/model.js').then(({ buildInternalModel }) => {
      import('../src/core/stepResponse.js').then(({ computeStepResponse }) => {
        import('../src/core/metrics.js').then(({ extractMetrics }) => {
          const out = document.getElementById('validation-output');
          const lines = [];
          let allPass = true;

          const check = (label, got, expected, tol = 1e-3) => {
            const pass = Math.abs(got - expected) <= tol;
            if (!pass) allPass = false;
            lines.push(`<span class="${pass?'pass':'fail'}">${pass?'✓ PASS':'✗ FAIL'}</span>  ${label}: got=${got.toFixed(6)}, expected=${expected} (tol=${tol})`);
          };

          try {
            const m = buildInternalModel({ mode:'coefficients', a2:1, a1:6, a0:25 });
            check('wn  {a2:1,a1:6,a0:25}',   m.wn,         5.0, 1e-6);
            check('ζ   {a2:1,a1:6,a0:25}',   m.zeta,       0.6, 1e-6);
            check('polo[0].re',               m.poles[0].re,-3.0,1e-6);
            check('polo[0].im',               m.poles[0].im, 4.0,1e-6);
            check('polo[1].re',               m.poles[1].re,-3.0,1e-6);
            check('polo[1].im',               m.poles[1].im,-4.0,1e-6);
            check('α = ζ·ωn',                 m.alpha,       3.0,1e-6);
            check('ωd = ωn√(1−ζ²)',           m.wd,          4.0,1e-6);
          } catch(e) { lines.push(`<span class="fail">✗ ERRO</span>  ${e.message}`); allPass=false; }

          try {
            const m2 = buildInternalModel({ mode:'poles', poles:[{re:-3,im:4},{re:-3,im:-4}] });
            check('wn  via poles', m2.wn,   5.0, 1e-6);
            check('ζ   via poles', m2.zeta, 0.6, 1e-6);
          } catch(e) { lines.push(`<span class="fail">✗ ERRO</span>  ${e.message}`); allPass=false; }

          try {
            const m3   = buildInternalModel({ mode:'canonical', zeta:0.6, wn:5 });
            const resp = computeStepResponse(m3, { nPoints:1000 });
            const m90  = extractMetrics(resp, { riseTimeMode:'10-90',        settlingBand:0.02 });
            const mFC  = extractMetrics(resp, { riseTimeMode:'first-crossing',settlingBand:0.02 });
            const ok90 = m90.riseTime !== null && m90.riseTime > 0;
            const okFC = mFC.riseTime !== null && mFC.riseTime > 0;
            const diff = Math.abs((m90.riseTime??0)-(mFC.riseTime??0)) > 1e-6;
            if(!ok90||!okFC||!diff) allPass=false;
            lines.push(`<span class="${ok90?'pass':'fail'}">${ok90?'✓ PASS':'✗ FAIL'}</span>  riseTime 10-90: ${m90.riseTime?.toFixed(4)} s`);
            lines.push(`<span class="${okFC?'pass':'fail'}">${okFC?'✓ PASS':'✗ FAIL'}</span>  riseTime first-crossing: ${mFC.riseTime?.toFixed(4)} s`);
            lines.push(`<span class="${diff?'pass':'fail'}">${diff?'✓ PASS':'✗ FAIL'}</span>  riseTimeMode produz valores distintos`);
          } catch(e) { lines.push(`<span class="fail">✗ ERRO</span>  ${e.message}`); allPass=false; }

          try {
            const m4   = buildInternalModel({ mode:'canonical', zeta:0.6, wn:5 });
            const resp = computeStepResponse(m4, { nPoints:1000 });
            const t2   = extractMetrics(resp, { settlingBand:0.02 });
            const t5   = extractMetrics(resp, { settlingBand:0.05 });
            const ok   = (t2.settlingTime??0) >= (t5.settlingTime??0);
            if(!ok) allPass=false;
            lines.push(`<span class="${ok?'pass':'fail'}">${ok?'✓ PASS':'✗ FAIL'}</span>  settlingBand: ts(2%)=${t2.settlingTime?.toFixed(4)}s ≥ ts(5%)=${t5.settlingTime?.toFixed(4)}s`);
          } catch(e) { lines.push(`<span class="fail">✗ ERRO</span>  ${e.message}`); allPass=false; }

          [
            {zeta:0.6,wn:5,expected:'underdamped'},
            {zeta:1.0,wn:5,expected:'critically_damped'},
            {zeta:2.0,wn:5,expected:'overdamped'},
            {zeta:0.0,wn:5,expected:'marginal'},
          ].forEach(({zeta,wn,expected}) => {
            try {
              const m = buildInternalModel({ mode:'canonical', zeta, wn });
              const pass = m.classification.key === expected;
              if(!pass) allPass=false;
              lines.push(`<span class="${pass?'pass':'fail'}">${pass?'✓ PASS':'✗ FAIL'}</span>  classify(ζ=${zeta}): "${m.classification.key}" === "${expected}"`);
            } catch(e) { lines.push(`<span class="fail">✗ ERRO</span>  ${e.message}`); allPass=false; }
          });

          lines.unshift(`\n<strong>Resultado: <span class="${allPass?'pass':'fail'}">${allPass?'✓ TODOS OS CRITÉRIOS PASSARAM':'✗ ALGUM CRITÉRIO FALHOU'}</span></strong>\n`);
          out.innerHTML = lines.join('\n');
        });
      });
    });
  }

  // ── Inicialização ────────────────────────────────────────────────────────
  const initial = { ...PRESETS.acceptance, theme: 'dark' };
  mount(initial);
  setTimeout(() => runValidation(initial), 900);
</script>
</body>
</html>
